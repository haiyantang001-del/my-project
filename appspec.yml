version: 0.0
os: linux
files:
  - source: /
    destination: /home/admin/crm-system
hooks:
  BeforeInstall:
    - location: deploy.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: start.sh
      timeout: 60
      runas: root
  ApplicationStop:
    - location: stop.sh
      timeout: 60
      runas: root
